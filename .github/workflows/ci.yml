name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod and go.sum are tidy
        # go.mod/go.sum merge cleanly as text while being semantically wrong:
        # merging a branch that added a dependency can drop another branch's
        # requirements, leaving code importing packages go.mod no longer
        # declares. Regenerating and diffing catches that on the PR.
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result."
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned: `latest` once resolved to a build targeting an older Go
          # than this module, which fails the config load.
          version: v2.15.0

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...
