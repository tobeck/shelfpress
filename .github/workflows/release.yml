name: Release

on:
  push:
    tags: ["v*"]

# Only what creating a release needs. No packages: write — container images are
# a later milestone, and a token that cannot publish one cannot leak the ability.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser derives the version and changelog from tags, so a
          # shallow clone gives it a truncated history to work from.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # The tag is what users install; publishing one whose tests were never run
      # would make the release the first place a failure shows up.
      - name: Test
        run: go test -race ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
